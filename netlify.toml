[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/"
  to = "/tr/"
  status = 302
  conditions = { Language = ["tr"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
